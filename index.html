<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12allteji</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Arial, sans-serif; color: #fff;
      background: radial-gradient(circle at top, #252044, #0b0b12 65%);
    }
    .card {
      width: min(360px, 90vw); padding: 32px 24px; text-align: center;
      border: 1px solid rgba(255,255,255,.12); border-radius: 24px;
      background: rgba(20,20,32,.78); box-shadow: 0 20px 60px #0008;
      backdrop-filter: blur(12px);
    }
    .avatar {
      width: 118px; height: 118px; object-fit: cover; border-radius: 50%;
      border: 3px solid #a78bfa; box-shadow: 0 0 24px #8b5cf666;
    }
    h1 { margin: 18px 0 8px; font-size: 27px; letter-spacing: 1px; }
    p { margin: 0 0 24px; color: #b9b7c8; font-size: 14px; }
    .socials { display: grid; gap: 12px; }
    .btn {
      display: block; padding: 14px; border-radius: 13px; color: white;
      text-decoration: none; font-weight: bold; transition: .2s;
      background: #252536; border: 1px solid #ffffff14;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.15); }
    .ig { background: linear-gradient(100deg,#833ab4,#fd1d1d,#fcb045); }
    .tt { background: #111; }
    .wa { background: #168c55; }
    footer { margin-top: 24px; font-size: 11px; color: #777; }
  </style>
</head>
<body>
  <main class="card">
    <!-- Ganti URL foto di bawah dengan URL gambar anime pilihanmu -->
    <img class="avatar" src="https://pin.it/1oerScjeR" alt="Anime profile picture">
    <h1>12allteji</h1>
    <p>Find me on social media ✦</p>
    <div class="socials">
      <a class="btn ig" href="https://www.instagram.com/refal_2008?knvt=NWdsOGdqam9seDNu" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="btn tt" href="https://tiktok.com/@12allteji" target="_blank" rel="noopener noreferrer">TikTok</a>
      <a class="btn wa" href="https://wa.me/628812245184" target="_blank" rel="noopener noreferrer">WhatsApp</a>
    </div>
    <footer>© 12allteji</footer>
  </main>
</body>
</html>
